
apiVersion: apps/v1
kind: Deployment
metadata:
  name: project-1
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: project-1
  template:
    metadata:
      labels:
        app: project-1
    spec:
      containers:
        - name: project-1
          image: karthik1217/project-1:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000

